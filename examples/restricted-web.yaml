# Run in the ordinary practice namespace: kubectl apply -f restricted-web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: practice-web}
  template:
    metadata:
      labels: {app: practice-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=hello-opsforge"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: practice-web
spec:
  selector: {app: practice-web}
  ports: [{port: 80, targetPort: 8080}]

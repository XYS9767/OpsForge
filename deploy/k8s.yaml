apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsforge-frontend
  namespace: opsforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsforge-frontend
  template:
    metadata:
      annotations:
        opsforge/config-hash: CONFIG_FINGERPRINT
      labels:
        app: opsforge-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: IMAGE_FRONTEND
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /
            port: 8080
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opsforge-proxy
  namespace: opsforge
spec:
  clusterIP: None
  selector:
    app: opsforge-frontend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:

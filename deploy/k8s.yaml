        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /api/live
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/live
            port: 8081
          initialDelaySeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      automountServiceAccountToken: false
---
apiVersion: v1

# Explicitly enabled native Kafka/TiDB workspaces; original practice RBAC is retained.
apiVersion: v1
kind: Namespace
metadata:
  name: opsforge-distributed
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsforge-distributed-broker
  namespace: opsforge-distributed
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsforge-distributed-broker
  namespace: opsforge-distributed
subjects:
  - kind: ServiceAccount
    name: opsforge-backend
    namespace: opsforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsforge-distributed-broker
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: distributed-limits
  namespace: opsforge-distributed
spec:
  hard:
    pods: "2"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 10Gi
    requests.ephemeral-storage: 2Gi
    limits.ephemeral-storage: 12Gi
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: distributed-defaults
  namespace: opsforge-distributed
spec:
  limits:
    - type: Container
      default: {cpu: "2", memory: "5Gi", ephemeral-storage: "6Gi"}
      defaultRequest: {cpu: "500m", memory: "1Gi", ephemeral-storage: "256Mi"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distributed-loopback-only
  namespace: opsforge-distributed
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []

name: opsforge-local
x-backend: &backend
  image: opsforge-backend:${OPSFORGE_IMAGE_TAG:-20261025-local}
  restart: unless-stopped
  environment: &environment
    SERVICE_SECRET: ${OPSFORGE_SERVICE_SECRET:?Set OPSFORGE_SERVICE_SECRET to at least 32 characters}
    LAB_BACKEND: simulation
    COOKIE_SECURE: "false"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/live', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s
services:
  opsforge-auth:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: auth
      OPSFORGE_PASSWORD: ${OPSFORGE_PASSWORD:?Set OPSFORGE_PASSWORD to at least 12 characters}
    volumes: [auth-data:/data]
  opsforge-bank:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: bank
    volumes: [bank-data:/data]
  opsforge-learning:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: learning
    volumes: [learning-data:/data]
  opsforge-exams:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: exams
    volumes: [exams-data:/data]
  opsforge-labs:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: labs
    volumes: [labs-data:/data]
  opsforge-gateway:
    <<: *backend
    environment:
      <<: *environment
      OPSFORGE_SERVICE: gateway
    depends_on:
      opsforge-auth: {condition: service_healthy}
      opsforge-bank: {condition: service_healthy}
      opsforge-learning: {condition: service_healthy}
      opsforge-exams: {condition: service_healthy}
      opsforge-labs: {condition: service_healthy}
  frontend:
    image: opsforge-frontend:${OPSFORGE_IMAGE_TAG:-20261025-local}
    restart: unless-stopped
    ports: ["127.0.0.1:${OPSFORGE_LOCAL_PORT:-18080}:8080"]
    depends_on:
      opsforge-gateway: {condition: service_healthy}
volumes:
  auth-data:
  bank-data:
  learning-data:
  exams-data:
  labs-data:
